{{- if and .Values.createServiceAccount (not .Values.k8sRBAC) }}
{{- /* namespaceScopedRBAC renders the same rules as a namespaced Role (bound below with a
       RoleBinding), so Holmes only gets access inside the release namespace. Cluster-scoped
       resources in the rules (nodes, persistentvolumes, ...) are legal in a Role but grant
       nothing. */}}
kind: {{ if .Values.namespaceScopedRBAC }}Role{{ else }}ClusterRole{{ end }}
apiVersion: rbac.authorization.k8s.io/v1
metadata:
  name: {{ .Release.Name }}-holmes{{ if .Values.namespaceScopedRBAC }}-role{{ else }}-cluster-role{{ end }}
  namespace : {{ .Release.Namespace }}
  {{- with (include "holmes.commonLabels" .) }}
  labels:
    {{- . | nindent 4 }}
  {{- end }}
  {{- with (include "holmes.commonAnnotations" .) }}
  annotations:
    {{- . | nindent 4 }}
  {{- end }}
rules:
  {{- if .Values.customClusterRoleRules }}
{{ toYaml .Values.customClusterRoleRules | indent 2 }}
  {{- end }}
{{- include "holmes.kubernetesReadRules" . }}

---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "holmes.serviceAccountName" . }}
  namespace: {{ .Release.Namespace }}
  {{- with (include "holmes.commonLabels" .) }}
  labels:
    {{- . | nindent 4 }}
  {{- end }}
  {{- $ann := dict -}}
  {{- with (include "holmes.commonAnnotations" . | fromYaml) -}}
  {{- $ann = mergeOverwrite $ann . -}}
  {{- end -}}
  {{- with .Values.serviceAccount.annotations -}}
  {{- $ann = mergeOverwrite $ann . -}}
  {{- end -}}
  {{- if $ann }}
  annotations:
    {{- toYaml $ann | nindent 4 }}
  {{- end }}
{{- if .Values.serviceAccount.imagePullSecrets }}
imagePullSecrets:
{{- toYaml .Values.serviceAccount.imagePullSecrets | nindent 2}}
{{- end }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: {{ if .Values.namespaceScopedRBAC }}RoleBinding{{ else }}ClusterRoleBinding{{ end }}
metadata:
  name: {{ .Release.Name }}-holmes{{ if .Values.namespaceScopedRBAC }}-role-binding{{ else }}-cluster-role-binding{{ end }}
  {{- if .Values.namespaceScopedRBAC }}
  namespace: {{ .Release.Namespace }}
  {{- end }}
  {{- with (include "holmes.commonLabels" .) }}
  labels:
    {{- . | nindent 4 }}
  {{- end }}
  {{- with (include "holmes.commonAnnotations" .) }}
  annotations:
    {{- . | nindent 4 }}
  {{- end }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: {{ if .Values.namespaceScopedRBAC }}Role{{ else }}ClusterRole{{ end }}
  name: {{ .Release.Name }}-holmes{{ if .Values.namespaceScopedRBAC }}-role{{ else }}-cluster-role{{ end }}
subjects:
  - kind: ServiceAccount
    name: {{ include "holmes.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
{{- if and .Values.openshift (not .Values.namespaceScopedRBAC) }}
---
kind: ClusterRoleBinding
apiVersion: rbac.authorization.k8s.io/v1
metadata:
  name: {{ .Release.Name }}-holmes-cluster-monitoring
  {{- with (include "holmes.commonLabels" .) }}
  labels:
    {{- . | nindent 4 }}
  {{- end }}
  {{- with (include "holmes.commonAnnotations" .) }}
  annotations:
    {{- . | nindent 4 }}
  {{- end }}
subjects:
  - kind: ServiceAccount
    name: {{ include "holmes.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: cluster-monitoring-view
{{- end }}
{{- end }}

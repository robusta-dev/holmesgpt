apiVersion: holmesgpt.dev/v1alpha1
kind: HealthCheck
metadata:
  name: webhook-smoke
  namespace: default
spec:
  query: "Is 2+2 equal to 5? Return passed=false."
  mode: alert
  destinations:
    - type: webhook
      config:
        webhook_url: "http://webhook-echo.default.svc.cluster.local:8088/"
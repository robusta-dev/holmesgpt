apiVersion: apps/v1
kind: Deployment
metadata:
  name: webhook-echo
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app: webhook-echo
  template:
    metadata:
      labels:
        app: webhook-echo
    spec:
      containers:
        - name: echo
          image: python:3.11-slim
          command:
            - python
            - -c
            - |
              from http.server import BaseHTTPRequestHandler, HTTPServer
              class H(BaseHTTPRequestHandler):
                  def do_POST(self):
                      n=int(self.headers.get("Content-Length",0))
                      print("WEBHOOK BODY:", self.rfile.read(n).decode(), flush=True)
                      self.send_response(200); self.end_headers()
              HTTPServer(("0.0.0.0",8088),H).serve_forever()
          ports:
            - containerPort: 8088
---
apiVersion: v1
kind: Service
metadata:
  name: webhook-echo
  namespace: default
spec:
  selector:
    app: webhook-echo
  ports:
    - port: 8088
      targetPort: 8088